image: node:20

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - verify
  - build

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

before_script:
  - npm ci

lint:
  stage: verify
  script:
    - npm run lint
    - npm run typecheck

test:
  stage: verify
  script:
    - npm run test

build:
  stage: build
  script:
    - npm run build
    - npm run size
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

backend:
  stage: verify
  script:
    - cd backend
    - npm ci
    - npm run typecheck
    - npm run test
    - npm run build
